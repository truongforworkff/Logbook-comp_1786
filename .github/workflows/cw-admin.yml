name: CW Admin
on:
  push:
    branches: [CW]
    paths: ['cw-admin/**', '.github/workflows/cw-admin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
        working-directory: cw-admin
      - uses: actions/upload-artifact@v4
        with:
          name: eventa-admin-debug
          path: cw-admin/app/build/outputs/apk/debug/app-debug.apk
