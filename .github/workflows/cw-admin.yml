name: CW Admin
on:
  push:
    branches: [CW]
    paths: ['cw-admin/**', 'cloud/firebase/**', '.github/workflows/cw-admin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: cloud/firebase
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
        working-directory: cw-admin
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify screens and SQLite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: |
            npx --yes firebase-tools@14.17.0 emulators:exec --only firestore,auth --project demo-eventa --config cloud/firebase/firebase.test.json "npm --prefix cloud/firebase test && ./cw-admin/gradlew -p cw-admin connectedDebugAndroidTest"
            adb pull /data/local/tmp/eventa-screenshots screenshots
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventa-ui-screenshots
          path: screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: eventa-admin-debug
          path: cw-admin/app/build/outputs/apk/debug/app-debug.apk
