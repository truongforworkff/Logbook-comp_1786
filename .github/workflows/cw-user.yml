name: CW User Flutter
on:
  push:
    branches: [CW]
    paths: ['cw-user/app/**', '.github/workflows/cw-user.yml']
  workflow_dispatch:
concurrency:
  group: cw-user-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cw-user/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - run: flutter build apk --debug --target-platform android-arm64,android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: eventa-flutter-android
          path: cw-user/app/build/app/outputs/flutter-apk/app-debug.apk
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: eventa-flutter-web
          path: cw-user/app/build/web
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Check G and H
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: cw-user/app
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d emulator-5554 --keep-app-running
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventa-flutter-screenshots
          path: cw-user/app/build/screenshots
