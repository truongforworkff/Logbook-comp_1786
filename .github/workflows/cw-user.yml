name: CW User MAUI
on:
  push:
    branches: [CW]
    paths: ['cw-user/app/**', 'cw-user/checks/**', 'cw-user/global.json', '.github/workflows/cw-user.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: cw-user/global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet workload install maui-android --skip-manifest-update
        working-directory: cw-user
      - run: dotnet run --project checks/Eventa.Checks.csproj
        working-directory: cw-user
      - run: dotnet build app/Eventa.User.csproj -c Debug -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
        working-directory: cw-user
      - uses: actions/upload-artifact@v4
        with:
          name: eventa-user-android
          path: cw-user/app/bin/Debug/net10.0-android/*Signed.apk
